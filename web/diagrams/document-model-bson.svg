<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250">
  <text class="t-label" x="50" y="30">BSON encoding of</text>
  <text class="t-mono t-b" x="50" y="52">{ name: "Ada", age: 36 }</text>
  <text class="t-sm" x="710" y="52" text-anchor="end">28 bytes, little-endian</text>

  <!-- element brackets -->
  <path class="ln faint" d="M150 98 L150 92 L448 92 L448 98"/>
  <text class="t-xs" x="299" y="84" text-anchor="middle">element 1 &#183; string</text>
  <path class="ln faint" d="M452 98 L452 92 L666 92 L666 98"/>
  <text class="t-xs" x="559" y="84" text-anchor="middle">element 2 &#183; int32</text>

  <!-- byte strip -->
  <rect class="box teal" x="50" y="104" width="96" height="40" rx="8"/>
  <text class="t-mono" x="98" y="128" text-anchor="middle">1c 00 00 00</text>
  <rect class="box blue" x="150" y="104" width="40" height="40" rx="8"/>
  <text class="t-mono t-b" x="170" y="128" text-anchor="middle">02</text>
  <rect class="box" x="194" y="104" width="80" height="40" rx="8"/>
  <text class="t-mono" x="234" y="128" text-anchor="middle">"name" 00</text>
  <rect class="box teal" x="278" y="104" width="96" height="40" rx="8"/>
  <text class="t-mono" x="326" y="128" text-anchor="middle">04 00 00 00</text>
  <rect class="box green" x="378" y="104" width="70" height="40" rx="8"/>
  <text class="t-mono" x="413" y="128" text-anchor="middle">"Ada" 00</text>
  <rect class="box blue" x="452" y="104" width="40" height="40" rx="8"/>
  <text class="t-mono t-b" x="472" y="128" text-anchor="middle">10</text>
  <rect class="box" x="496" y="104" width="70" height="40" rx="8"/>
  <text class="t-mono" x="531" y="128" text-anchor="middle">"age" 00</text>
  <rect class="box green" x="570" y="104" width="96" height="40" rx="8"/>
  <text class="t-mono" x="618" y="128" text-anchor="middle">24 00 00 00</text>
  <rect class="box gray" x="670" y="104" width="40" height="40" rx="8"/>
  <text class="t-mono" x="690" y="128" text-anchor="middle">00</text>

  <!-- labels -->
  <text class="t-xs" x="98" y="162" text-anchor="middle">doc length</text>
  <text class="t-xs" x="170" y="162" text-anchor="middle">type</text>
  <text class="t-xs" x="234" y="162" text-anchor="middle">key</text>
  <text class="t-xs" x="326" y="162" text-anchor="middle">string length</text>
  <text class="t-xs" x="413" y="162" text-anchor="middle">value</text>
  <text class="t-xs" x="472" y="162" text-anchor="middle">type</text>
  <text class="t-xs" x="531" y="162" text-anchor="middle">key</text>
  <text class="t-xs" x="618" y="162" text-anchor="middle">value</text>
  <text class="t-xs" x="690" y="162" text-anchor="middle">end</text>

  <!-- takeaways -->
  <circle class="fill-teal" cx="55" cy="200" r="4"/>
  <text class="t-sm" x="67" y="204"><tspan class="t-b">Length prefixes</tspan> let the server skip a whole field or sub-document without parsing it</text>
  <circle class="fill-blue" cx="55" cy="224" r="4"/>
  <text class="t-sm" x="67" y="228"><tspan class="t-b">Keys are stored in every document</tspan> &#8212; compression on disk hides most of the cost</text>
</svg>
