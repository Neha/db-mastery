<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310">
  <!-- ========== RAM: hash map ========== -->
  <rect class="box panel" x="20" y="20" width="200" height="200" rx="16"/>
  <text class="t-label" x="120" y="44" text-anchor="middle">Hash map &#183; RAM</text>

  <rect class="box blue" x="40" y="60" width="160" height="30" rx="10"/>
  <text class="t-mono" x="120" y="79" text-anchor="middle">emu &#8594; s1 @ 0</text>
  <rect class="box blue" x="40" y="104" width="160" height="30" rx="10"/>
  <text class="t-mono" x="120" y="123" text-anchor="middle">dog &#8594; s2 @ 0</text>
  <rect class="box blue" x="40" y="148" width="160" height="30" rx="10"/>
  <text class="t-mono" x="120" y="167" text-anchor="middle">cat &#8594; s2 @ 32</text>
  <text class="t-xs" x="120" y="204" text-anchor="middle">every key must fit in memory</text>

  <!-- ========== Disk: segments ========== -->
  <rect class="box panel" x="250" y="20" width="490" height="200" rx="16"/>
  <text class="t-label" x="495" y="44" text-anchor="middle">Append-only segments &#183; disk</text>

  <rect class="box teal" x="400" y="62" width="78" height="34" rx="10"/>
  <text class="t-mono t-b" x="439" y="83" text-anchor="middle">emu: 3</text>
  <rect class="box gray" x="488" y="62" width="78" height="34" rx="10"/>
  <text class="t-mono t-muted" x="527" y="83" text-anchor="middle">cat: 1</text>
  <rect class="box gray" x="576" y="62" width="78" height="34" rx="10"/>
  <text class="t-mono t-muted" x="615" y="83" text-anchor="middle">dog: 7</text>
  <text class="t-b" x="668" y="76">segment 1</text>
  <text class="t-xs" x="668" y="91">immutable</text>

  <rect class="box teal" x="400" y="136" width="78" height="34" rx="10"/>
  <text class="t-mono t-b" x="439" y="157" text-anchor="middle">dog: 8</text>
  <rect class="box teal" x="488" y="136" width="78" height="34" rx="10"/>
  <text class="t-mono t-b" x="527" y="157" text-anchor="middle">cat: 2</text>
  <rect class="box ghost" x="576" y="136" width="78" height="34" rx="10"/>
  <text class="t-xs t-blue" x="615" y="157" text-anchor="middle">next write</text>
  <text class="t-b" x="668" y="150">segment 2</text>
  <text class="t-xs" x="668" y="165">active</text>

  <text class="t-xs" x="527" y="112" text-anchor="middle">stale values wait for the merge</text>

  <!-- pointers -->
  <path class="ln blue" d="M201 75 C 300 75, 300 79, 398 79" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M201 119 C 300 119, 300 153, 398 153" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M201 163 C 320 210, 527 210, 527 172" marker-end="url(#arr-blue)"/>

  <!-- ========== Merge ========== -->
  <rect class="box panel" x="20" y="240" width="720" height="58" rx="16"/>
  <text class="t-label" x="40" y="265">Background merge</text>
  <text class="t-xs" x="40" y="281">keeps the newest value per key</text>
  <text class="t-mono" x="320" y="273" text-anchor="middle">s1 + s2</text>
  <path class="ln purple" d="M356 269 L410 269" marker-end="url(#arr-purple)"/>
  <rect class="box teal" x="420" y="254" width="84" height="30" rx="10"/>
  <text class="t-mono" x="462" y="273" text-anchor="middle">emu: 3</text>
  <rect class="box teal" x="514" y="254" width="84" height="30" rx="10"/>
  <text class="t-mono" x="556" y="273" text-anchor="middle">dog: 8</text>
  <rect class="box teal" x="608" y="254" width="84" height="30" rx="10"/>
  <text class="t-mono" x="650" y="273" text-anchor="middle">cat: 2</text>
</svg>
