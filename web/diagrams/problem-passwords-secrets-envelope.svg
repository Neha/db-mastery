<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <rect class="box purple" x="230" y="12" width="300" height="52" rx="12"/>
  <text class="t-b" x="380" y="34" text-anchor="middle">KMS holds the KEK</text>
  <text class="t-xs" x="380" y="50" text-anchor="middle">key-encryption key never leaves</text>

  <rect class="box panel" x="12" y="80" width="360" height="200" rx="16"/>
  <text class="t-label" x="192" y="104" text-anchor="middle">Encrypt</text>

  <rect class="box gray" x="32" y="120" width="140" height="40" rx="10"/>
  <text class="t-sm" x="102" y="145" text-anchor="middle">Plaintext</text>

  <rect class="box blue" x="212" y="120" width="140" height="40" rx="10"/>
  <text class="t-sm" x="282" y="145" text-anchor="middle">Random DEK</text>

  <path class="ln purple dash" d="M380 64 L282 120" marker-end="url(#arr-purple)"/>

  <path class="ln blue" d="M102 160 L102 184" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M282 160 L282 184" marker-end="url(#arr-blue)"/>

  <rect class="box teal" x="32" y="188" width="320" height="72" rx="12"/>
  <text class="t-b" x="192" y="216" text-anchor="middle">Store together</text>
  <text class="t-xs" x="192" y="236" text-anchor="middle">ciphertext + wrapped DEK</text>
  <text class="t-xs" x="192" y="252" text-anchor="middle">DEK wrapped by the KEK</text>

  <rect class="box panel" x="388" y="80" width="360" height="200" rx="16"/>
  <text class="t-label" x="568" y="104" text-anchor="middle">Decrypt</text>

  <rect class="box teal" x="408" y="120" width="320" height="40" rx="10"/>
  <text class="t-sm" x="568" y="145" text-anchor="middle">ciphertext + wrapped DEK</text>

  <path class="ln purple dash" d="M480 64 L568 120" marker-end="url(#arr-purple)"/>
  <path class="ln purple" d="M568 160 L568 176"/>
  <path class="ln purple" d="M568 176 L483 188" marker-end="url(#arr-purple)"/>

  <rect class="box purple" x="408" y="188" width="150" height="72" rx="12"/>
  <text class="t-b" x="483" y="216" text-anchor="middle">Unwrap DEK</text>
  <text class="t-xs" x="483" y="236" text-anchor="middle">KMS uses KEK</text>

  <rect class="box green" x="578" y="188" width="150" height="72" rx="12"/>
  <text class="t-b" x="653" y="216" text-anchor="middle">Plaintext</text>
  <text class="t-xs" x="653" y="236" text-anchor="middle">DEK decrypts data</text>

  <path class="ln green" d="M558 224 L578 224" marker-end="url(#arr-green)"/>

  <rect class="box green" x="12" y="296" width="736" height="32" rx="16"/>
  <text class="t-sm" x="380" y="316" text-anchor="middle">Rotate the KEK by re-wrapping DEKs. No need to re-encrypt the data.</text>
</svg>
