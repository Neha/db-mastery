<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <!-- lane labels -->
  <text class="t-b" x="20" y="64">Client</text>
  <text class="t-b" x="20" y="134">Leader</text>
  <text class="t-b" x="20" y="200">Follower 1</text>
  <text class="t-xs" x="20" y="215">synchronous</text>
  <text class="t-b" x="20" y="270">Follower 2</text>
  <text class="t-xs" x="20" y="285">asynchronous</text>

  <!-- lanes -->
  <path class="ln faint" d="M120 60 L470 60"/>
  <path class="ln faint" d="M120 130 L470 130"/>
  <path class="ln faint" d="M120 200 L470 200"/>
  <path class="ln faint" d="M120 270 L470 270"/>

  <!-- wait bracket -->
  <path class="ln orange" d="M182 104 L182 110 L294 110 L294 104"/>
  <text class="t-xs t-orange" x="238" y="99" text-anchor="middle">commit waits for follower 1</text>

  <!-- client write -->
  <text class="t-mono" x="132" y="48">write x=1</text>
  <path class="ln blue" d="M146 62 L178 125" marker-end="url(#arr-blue)"/>
  <circle class="fill-blue" cx="182" cy="130" r="4"/>

  <!-- sync follower round trip -->
  <path class="ln purple" d="M186 134 L232 194" marker-end="url(#arr-purple)"/>
  <circle class="fill-purple" cx="238" cy="200" r="4"/>
  <path class="ln green" d="M243 195 L288 136" marker-end="url(#arr-green)"/>
  <text class="t-xs t-green" x="276" y="178">ack</text>

  <!-- commit + reply -->
  <circle class="fill-green" cx="294" cy="130" r="4"/>
  <text class="t-xs t-green" x="304" y="150">committed</text>
  <path class="ln green" d="M298 126 L330 66" marker-end="url(#arr-green)"/>
  <text class="t-mono t-green" x="340" y="48">OK</text>

  <!-- async follower -->
  <path class="ln purple dash" d="M188 135 L416 265" marker-end="url(#arr-purple)"/>
  <circle class="fill-purple" cx="422" cy="270" r="4"/>
  <text class="t-xs t-purple" x="422" y="290" text-anchor="middle">applied later (lag)</text>

  <text class="t-xs" x="470" y="48" text-anchor="end">time &#8594;</text>

  <!-- explanation panel -->
  <rect class="box panel" x="496" y="20" width="250" height="264" rx="16"/>
  <text class="t-label" x="516" y="46">Commit waits for&#8230;</text>

  <text class="t-b" x="516" y="76">Synchronous</text>
  <text class="t-sm" x="516" y="93">every synchronous follower</text>
  <text class="t-sm" x="516" y="109"><tspan class="t-green t-b">&#10003;</tspan> no acknowledged write lost</text>

  <text class="t-b" x="516" y="141">Asynchronous</text>
  <text class="t-sm" x="516" y="158">the leader&#8217;s local disk only</text>
  <text class="t-sm" x="516" y="174"><tspan class="t-orange t-b">!</tspan> failover can drop recent writes</text>

  <text class="t-b" x="516" y="206">Semi-sync / quorum</text>
  <text class="t-sm" x="516" y="223">one follower, or a majority</text>
  <text class="t-sm" x="516" y="239"><tspan class="t-green t-b">&#10003;</tspan> one slow node doesn&#8217;t stall</text>
  <text class="t-xs" x="516" y="266">MySQL semi-sync &#183; Raft &#183; MongoDB w:majority</text>
</svg>
