<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <!-- Roles -->
  <rect class="box panel" x="4" y="4" width="300" height="352" rx="16"/>
  <text class="t-label" x="154" y="30" text-anchor="middle">Roles and terms</text>

  <circle class="box" cx="154" cy="86" r="28"/>
  <text class="t-b" x="154" y="91" text-anchor="middle">F</text>
  <text class="t-xs" x="154" y="128" text-anchor="middle">Follower</text>

  <path class="ln orange" d="M154 114 L154 150" marker-end="url(#arr-orange)"/>
  <text class="t-xs t-orange" x="162" y="140">timeout</text>

  <circle class="box orange" cx="154" cy="186" r="28"/>
  <text class="t-b" x="154" y="191" text-anchor="middle">C</text>
  <text class="t-xs" x="154" y="228" text-anchor="middle">Candidate &#183; term++</text>

  <path class="ln green" d="M154 214 L154 250" marker-end="url(#arr-green)"/>
  <text class="t-xs t-green" x="162" y="240">majority votes</text>

  <circle class="box green" cx="154" cy="286" r="28"/>
  <text class="t-b" x="154" y="291" text-anchor="middle">L</text>
  <text class="t-xs" x="154" y="328" text-anchor="middle">Leader &#183; heartbeats</text>

  <path class="ln dash" d="M126 286 C 48 286, 48 86, 126 86" marker-end="url(#arr)"/>
  <text class="t-xs" x="56" y="188">higher</text>
  <text class="t-xs" x="56" y="202">term</text>

  <!-- Majority commit -->
  <rect class="box panel" x="320" y="4" width="436" height="352" rx="16"/>
  <text class="t-label" x="538" y="30" text-anchor="middle">Majority commit</text>
  <text class="t-xs" x="538" y="48" text-anchor="middle">client write reaches a majority, then the leader applies</text>

  <rect class="box gray" x="344" y="64" width="88" height="36" rx="18"/>
  <text class="t-sm" x="388" y="86" text-anchor="middle">Client</text>
  <path class="ln blue" d="M432 82 L480 82" marker-end="url(#arr-blue)"/>

  <rect class="box green" x="484" y="64" width="200" height="36" rx="12"/>
  <text class="t-b" x="584" y="86" text-anchor="middle">Leader &#183; index 42</text>

  <path class="ln purple" d="M584 100 L584 128" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="592" y="118">AppendEntries</text>

  <rect class="box green" x="344" y="132" width="112" height="56" rx="12"/>
  <text class="t-sm t-b" x="400" y="154" text-anchor="middle">N1</text>
  <text class="t-mono t-xs" x="400" y="172" text-anchor="middle">42 stored</text>

  <rect class="box green" x="472" y="132" width="112" height="56" rx="12"/>
  <text class="t-sm t-b" x="528" y="154" text-anchor="middle">N2 leader</text>
  <text class="t-mono t-xs" x="528" y="172" text-anchor="middle">42 stored</text>

  <rect class="box green" x="600" y="132" width="132" height="56" rx="12"/>
  <text class="t-sm t-b" x="666" y="154" text-anchor="middle">N3</text>
  <text class="t-mono t-xs" x="666" y="172" text-anchor="middle">42 stored</text>

  <rect class="box ghost" x="408" y="204" width="112" height="56" rx="12"/>
  <text class="t-sm" x="464" y="226" text-anchor="middle">N4</text>
  <text class="t-mono t-xs" x="464" y="244" text-anchor="middle">still empty</text>

  <rect class="box ghost" x="536" y="204" width="112" height="56" rx="12"/>
  <text class="t-sm" x="592" y="226" text-anchor="middle">N5</text>
  <text class="t-mono t-xs" x="592" y="244" text-anchor="middle">still empty</text>

  <rect class="box green" x="400" y="280" width="248" height="52" rx="12"/>
  <text class="t-b t-green" x="524" y="302" text-anchor="middle">3 of 5 &#8658; COMMITTED</text>
  <text class="t-xs" x="524" y="320" text-anchor="middle">apply, then reply to the client</text>
</svg>
