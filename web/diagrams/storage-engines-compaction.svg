<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <!-- ========== Size-tiered ========== -->
  <rect class="box panel" x="4" y="4" width="370" height="332" rx="16"/>
  <text class="t-label" x="189" y="32" text-anchor="middle">Size-tiered</text>

  <rect class="box teal" x="62" y="54" width="56" height="28" rx="8"/>
  <rect class="box teal" x="128" y="54" width="56" height="28" rx="8"/>
  <rect class="box teal" x="194" y="54" width="56" height="28" rx="8"/>
  <rect class="box teal" x="260" y="54" width="56" height="28" rx="8"/>
  <path class="ln purple" d="M189 84 L189 110" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="198" y="101">merge 4 similar sizes</text>

  <rect class="box purple" x="41" y="112" width="92" height="32" rx="10"/>
  <text class="t-xs" x="87" y="132" text-anchor="middle">just merged</text>
  <rect class="box teal" x="143" y="112" width="92" height="32" rx="10"/>
  <rect class="box teal" x="245" y="112" width="92" height="32" rx="10"/>
  <path class="ln purple dash" d="M189 146 L189 172" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="198" y="163">later, merge again</text>

  <rect class="box teal" x="41" y="174" width="296" height="38" rx="11"/>
  <text class="t-sm" x="189" y="197" text-anchor="middle">one large SSTable</text>

  <text class="t-sm" x="189" y="248" text-anchor="middle"><tspan class="t-green t-b">&#10003;</tspan> low write amplification</text>
  <text class="t-sm" x="189" y="268" text-anchor="middle"><tspan class="t-orange t-b">!</tspan> a key may sit in many files</text>
  <text class="t-sm" x="189" y="288" text-anchor="middle"><tspan class="t-orange t-b">!</tspan> big merges need free space</text>
  <text class="t-xs" x="189" y="318" text-anchor="middle">Cassandra STCS &#183; HBase &#183; RocksDB universal</text>

  <!-- ========== Leveled ========== -->
  <rect class="box panel" x="386" y="4" width="370" height="332" rx="16"/>
  <text class="t-label" x="571" y="32" text-anchor="middle">Leveled</text>

  <text class="t-b" x="402" y="73">L0</text>
  <rect class="box teal" x="446" y="54" width="56" height="28" rx="8"/>
  <rect class="box teal" x="512" y="54" width="56" height="28" rx="8"/>

  <text class="t-b" x="402" y="128">L1</text>
  <text class="t-xs" x="402" y="142">1 run</text>
  <rect class="box teal" x="446" y="112" width="70" height="32" rx="10"/>
  <text class="t-mono" x="481" y="132" text-anchor="middle">a&#8211;f</text>
  <rect class="box purple" x="520" y="112" width="70" height="32" rx="10"/>
  <text class="t-mono" x="555" y="132" text-anchor="middle">g&#8211;m</text>
  <rect class="box teal" x="594" y="112" width="70" height="32" rx="10"/>
  <text class="t-mono" x="629" y="132" text-anchor="middle">n&#8211;s</text>
  <rect class="box teal" x="668" y="112" width="70" height="32" rx="10"/>
  <text class="t-mono" x="703" y="132" text-anchor="middle">t&#8211;z</text>

  <path class="ln purple dash" d="M555 146 L555 172" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="564" y="163">rewrite overlapping L2 files</text>

  <text class="t-b" x="402" y="190">L2</text>
  <text class="t-xs" x="402" y="204">10&#215; L1</text>
  <rect class="box teal" x="446" y="174" width="33" height="38" rx="8"/>
  <rect class="box teal" x="483" y="174" width="33" height="38" rx="8"/>
  <rect class="box purple" x="520" y="174" width="33" height="38" rx="8"/>
  <rect class="box purple" x="557" y="174" width="33" height="38" rx="8"/>
  <rect class="box teal" x="594" y="174" width="33" height="38" rx="8"/>
  <rect class="box teal" x="631" y="174" width="33" height="38" rx="8"/>
  <rect class="box teal" x="668" y="174" width="33" height="38" rx="8"/>
  <rect class="box teal" x="705" y="174" width="33" height="38" rx="8"/>

  <text class="t-sm" x="571" y="248" text-anchor="middle"><tspan class="t-green t-b">&#10003;</tspan> at most one file per level per read</text>
  <text class="t-sm" x="571" y="268" text-anchor="middle"><tspan class="t-green t-b">&#10003;</tspan> ~10% space overhead</text>
  <text class="t-sm" x="571" y="288" text-anchor="middle"><tspan class="t-orange t-b">!</tspan> 10&#8211;30&#215; write amplification</text>
  <text class="t-xs" x="571" y="318" text-anchor="middle">RocksDB &#183; LevelDB &#183; Cassandra LCS</text>
</svg>
