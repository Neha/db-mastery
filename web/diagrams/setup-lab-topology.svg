<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <!-- ========== Column 1: portal ========== -->
  <text class="t-label" x="105" y="34" text-anchor="middle">Portal</text>
  <rect class="box gray" x="30" y="48" width="150" height="34" rx="17"/>
  <text class="t-sm" x="105" y="69" text-anchor="middle">browser &#183; :8080</text>
  <path class="ln" d="M105 82 L105 112" marker-end="url(#arr)"/>

  <rect class="box blue" x="30" y="114" width="150" height="56" rx="12"/>
  <text class="t-b" x="105" y="138" text-anchor="middle">Go web server</text>
  <text class="t-mono" x="105" y="157" text-anchor="middle">make dev</text>
  <path class="ln" d="M105 200 L105 172" marker-end="url(#arr)"/>
  <text class="t-xs" x="113" y="189">reads</text>

  <rect class="box teal" x="30" y="202" width="150" height="56" rx="12"/>
  <text class="t-b" x="105" y="226" text-anchor="middle">web/ on disk</text>
  <text class="t-xs" x="105" y="244" text-anchor="middle">lessons &#183; diagrams</text>
  <text class="t-xs" x="105" y="284" text-anchor="middle">edit, then refresh</text>
  <text class="t-xs" x="105" y="300" text-anchor="middle">(make portal embeds web/)</text>

  <!-- ========== Column 2: labs ========== -->
  <text class="t-label" x="305" y="34" text-anchor="middle">Labs</text>
  <rect class="box gray" x="230" y="48" width="150" height="34" rx="17"/>
  <text class="t-sm" x="305" y="69" text-anchor="middle">your terminal</text>
  <path class="ln" d="M305 82 L305 112" marker-end="url(#arr)"/>

  <rect class="box blue" x="230" y="114" width="150" height="56" rx="12"/>
  <text class="t-b" x="305" y="138" text-anchor="middle">Database labs</text>
  <text class="t-mono" x="305" y="157" text-anchor="middle">go run ./labs/&#8230;</text>

  <rect class="box" x="230" y="202" width="150" height="56" rx="12"/>
  <text class="t-b" x="305" y="226" text-anchor="middle">Internals labs</text>
  <text class="t-mono" x="305" y="245" text-anchor="middle">make test</text>
  <text class="t-xs" x="305" y="284" text-anchor="middle">pure Go, no database</text>

  <!-- labs to containers -->
  <path class="ln blue" d="M380 134 C 412 134, 416 96, 446 96" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M380 150 C 412 150, 416 200, 446 200" marker-end="url(#arr-blue)"/>

  <!-- ========== Column 3: Docker ========== -->
  <rect class="box panel" x="430" y="16" width="314" height="296" rx="16"/>
  <text class="t-label" x="587" y="40" text-anchor="middle">Docker &#183; make up</text>

  <rect class="box blue" x="448" y="58" width="278" height="78" rx="12"/>
  <text class="t-b" x="466" y="84">PostgreSQL 16</text>
  <text class="t-mono" x="466" y="103">dbm-postgres</text>
  <text class="t-sm" x="466" y="122">localhost:5442 &#8594; 5432</text>
  <rect class="box teal" x="632" y="84" width="78" height="26" rx="13"/>
  <text class="t-xs" x="671" y="101" text-anchor="middle">pgdata</text>

  <rect class="box blue" x="448" y="162" width="278" height="78" rx="12"/>
  <text class="t-b" x="466" y="188">MongoDB 7</text>
  <text class="t-mono" x="466" y="207">dbm-mongo</text>
  <text class="t-sm" x="466" y="226">localhost:27017 &#183; rs0</text>
  <rect class="box teal" x="624" y="188" width="86" height="26" rx="13"/>
  <text class="t-xs" x="667" y="205" text-anchor="middle">mongodata</text>

  <text class="t-xs" x="587" y="272" text-anchor="middle">make down: stop, keep volumes</text>
  <text class="t-xs" x="587" y="290" text-anchor="middle">make reset: stop and delete volumes</text>
</svg>
