<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <text class="t-label" x="380" y="24" text-anchor="middle">Event time</text>
  <text class="t-xs" x="380" y="42" text-anchor="middle">watermark = max event time seen &#8722; 10 minutes</text>

  <rect class="box panel" x="20" y="56" width="340" height="120" rx="16"/>
  <text class="t-label" x="190" y="80" text-anchor="middle">window 12:00</text>
  <circle class="fill-green" cx="80" cy="118" r="7"/>
  <text class="t-sm" x="96" y="114">e1</text>
  <text class="t-xs t-green" x="96" y="130">on time</text>
  <circle class="fill-orange" cx="200" cy="118" r="7"/>
  <text class="t-sm" x="216" y="114">e2</text>
  <text class="t-xs t-orange" x="216" y="130">late +6 min, kept</text>

  <rect class="box panel" x="380" y="56" width="360" height="120" rx="16"/>
  <text class="t-label" x="560" y="80" text-anchor="middle">window 12:01</text>
  <circle class="fill-red" cx="500" cy="118" r="7"/>
  <text class="t-sm" x="516" y="114">e3</text>
  <text class="t-xs t-red" x="516" y="130">event 12:00, +15 min late</text>

  <path class="ln orange thick" d="M370 48 L370 184"/>
  <text class="t-xs t-orange t-b" x="370" y="200" text-anchor="middle">watermark now</text>
  <text class="t-xs t-muted" x="370" y="216" text-anchor="middle">12:00 window is final</text>

  <rect class="box green" x="20" y="232" width="230" height="48" rx="12"/>
  <text class="t-sm t-b" x="135" y="252" text-anchor="middle">e1 counted</text>
  <text class="t-xs" x="135" y="268" text-anchor="middle">arrived inside the bound</text>

  <rect class="box orange" x="266" y="232" width="230" height="48" rx="12"/>
  <text class="t-sm t-b" x="381" y="252" text-anchor="middle">e2 counted</text>
  <text class="t-xs" x="381" y="268" text-anchor="middle">late, still before watermark</text>

  <rect class="box red" x="510" y="232" width="230" height="48" rx="12"/>
  <text class="t-sm t-b" x="625" y="252" text-anchor="middle">e3 dropped</text>
  <text class="t-xs" x="625" y="268" text-anchor="middle">state already gone</text>
</svg>
