<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <!-- ========== write path ========== -->
  <rect class="box gray" x="20" y="40" width="90" height="32" rx="16"/>
  <text class="t-sm" x="65" y="60" text-anchor="middle">write k=v</text>
  <path class="ln blue" d="M110 56 L138 56" marker-end="url(#arr-blue)"/>

  <rect class="box teal" x="140" y="34" width="140" height="44" rx="12"/>
  <text class="t-b" x="210" y="53" text-anchor="middle">WAL</text>
  <text class="t-xs" x="210" y="69" text-anchor="middle">sequential append</text>
  <path class="ln blue" d="M280 56 L308 56" marker-end="url(#arr-blue)"/>

  <rect class="box blue" x="310" y="34" width="150" height="44" rx="12"/>
  <text class="t-b" x="385" y="53" text-anchor="middle">Memtable</text>
  <text class="t-xs" x="385" y="69" text-anchor="middle">sorted, in RAM</text>
  <path class="ln" d="M460 56 L488 56" marker-end="url(#arr)"/>
  <text class="t-xs" x="474" y="48" text-anchor="middle">full</text>

  <rect class="box ghost" x="490" y="34" width="120" height="44" rx="12"/>
  <text class="t-b" x="550" y="53" text-anchor="middle">Immutable</text>
  <text class="t-xs" x="550" y="69" text-anchor="middle">being flushed</text>

  <!-- ========== levels ========== -->
  <rect class="box panel" x="20" y="108" width="600" height="224" rx="16"/>

  <path class="ln purple" d="M550 78 L550 128" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="558" y="104">flush</text>

  <text class="t-b" x="40" y="148">L0</text>
  <text class="t-xs" x="40" y="163">overlapping</text>
  <rect class="box teal" x="270" y="130" width="100" height="36" rx="10"/>
  <text class="t-mono" x="320" y="152" text-anchor="middle">c&#8211;x</text>
  <rect class="box teal" x="380" y="130" width="100" height="36" rx="10"/>
  <text class="t-mono" x="430" y="152" text-anchor="middle">a&#8211;m</text>
  <rect class="box teal" x="490" y="130" width="100" height="36" rx="10"/>
  <text class="t-mono" x="540" y="152" text-anchor="middle">f&#8211;t</text>

  <path class="ln purple dash" d="M300 166 L280 198" marker-end="url(#arr-purple)"/>
  <text class="t-xs t-purple" x="196" y="186">compaction</text>

  <text class="t-b" x="40" y="218">L1</text>
  <text class="t-xs" x="40" y="233">one sorted run</text>
  <rect class="box teal" x="140" y="200" width="104" height="36" rx="10"/>
  <text class="t-mono" x="192" y="222" text-anchor="middle">a&#8211;f</text>
  <rect class="box teal" x="256" y="200" width="104" height="36" rx="10"/>
  <text class="t-mono" x="308" y="222" text-anchor="middle">g&#8211;m</text>
  <rect class="box teal" x="372" y="200" width="104" height="36" rx="10"/>
  <text class="t-mono" x="424" y="222" text-anchor="middle">n&#8211;s</text>
  <rect class="box teal" x="488" y="200" width="104" height="36" rx="10"/>
  <text class="t-mono" x="540" y="222" text-anchor="middle">t&#8211;z</text>

  <path class="ln purple dash" d="M424 236 L424 268" marker-end="url(#arr-purple)"/>

  <text class="t-b" x="40" y="288">L2</text>
  <text class="t-xs" x="40" y="303">~10&#215; larger</text>
  <rect class="box teal" x="140" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="197" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="254" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="311" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="368" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="425" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="482" y="270" width="50" height="36" rx="9"/>
  <rect class="box teal" x="539" y="270" width="53" height="36" rx="9"/>
  <text class="t-xs" x="366" y="318" text-anchor="middle">non-overlapping key ranges</text>

  <!-- ========== read path ========== -->
  <rect class="box blue" x="640" y="34" width="100" height="30" rx="15"/>
  <text class="t-sm t-b" x="690" y="53" text-anchor="middle">read k</text>
  <path class="ln blue" d="M690 64 L690 78" marker-end="url(#arr-blue)"/>
  <rect class="box" x="640" y="80" width="100" height="30" rx="10"/>
  <text class="t-sm" x="690" y="99" text-anchor="middle">1 memtable</text>
  <path class="ln blue" d="M690 110 L690 128" marker-end="url(#arr-blue)"/>
  <rect class="box" x="640" y="130" width="100" height="36" rx="10"/>
  <text class="t-sm" x="690" y="152" text-anchor="middle">2 each L0 file</text>
  <path class="ln blue" d="M690 166 L690 198" marker-end="url(#arr-blue)"/>
  <rect class="box" x="640" y="200" width="100" height="36" rx="10"/>
  <text class="t-sm" x="690" y="222" text-anchor="middle">3 one L1 file</text>
  <path class="ln blue" d="M690 236 L690 268" marker-end="url(#arr-blue)"/>
  <rect class="box" x="640" y="270" width="100" height="36" rx="10"/>
  <text class="t-sm" x="690" y="292" text-anchor="middle">4 one L2 file</text>

  <!-- footer -->
  <circle class="fill-green" cx="190" cy="358" r="5"/>
  <text class="t-sm" x="202" y="362"><tspan class="t-b">Bloom filter per file:</tspan> "definitely not here" skips the disk read</text>
</svg>
