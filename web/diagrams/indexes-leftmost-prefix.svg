<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <text class="t-label" x="380" y="24" text-anchor="middle">Index on (country, created_at)</text>
  <text class="t-xs" x="380" y="42" text-anchor="middle">sorted by country, then by date within each country</text>

  <rect class="box" x="20" y="56" width="112" height="44" rx="10"/>
  <text class="t-mono" x="76" y="74" text-anchor="middle">FR</text>
  <text class="t-mono t-xs" x="76" y="90" text-anchor="middle">Jan</text>

  <rect class="box green" x="148" y="56" width="112" height="44" rx="10"/>
  <text class="t-mono t-b" x="204" y="74" text-anchor="middle">GB</text>
  <text class="t-mono t-xs" x="204" y="90" text-anchor="middle">Jan</text>

  <rect class="box green" x="276" y="56" width="112" height="44" rx="10"/>
  <text class="t-mono t-b" x="332" y="74" text-anchor="middle">GB</text>
  <text class="t-mono t-xs" x="332" y="90" text-anchor="middle">Mar</text>

  <rect class="box green" x="404" y="56" width="112" height="44" rx="10"/>
  <text class="t-mono t-b" x="460" y="74" text-anchor="middle">GB</text>
  <text class="t-mono t-xs" x="460" y="90" text-anchor="middle">Jun</text>

  <rect class="box" x="532" y="56" width="112" height="44" rx="10"/>
  <text class="t-mono" x="588" y="74" text-anchor="middle">US</text>
  <text class="t-mono t-xs" x="588" y="90" text-anchor="middle">Feb</text>

  <rect class="box" x="660" y="56" width="80" height="44" rx="10"/>
  <text class="t-mono" x="700" y="74" text-anchor="middle">US</text>
  <text class="t-mono t-xs" x="700" y="90" text-anchor="middle">May</text>

  <path class="ln blue" d="M132 78 L146 78" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M260 78 L274 78" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M388 78 L402 78" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M516 78 L530 78" marker-end="url(#arr-blue)"/>
  <path class="ln blue" d="M644 78 L658 78" marker-end="url(#arr-blue)"/>

  <!-- Seek -->
  <rect class="box panel" x="4" y="124" width="368" height="208" rx="16"/>
  <text class="t-label" x="188" y="150" text-anchor="middle">Seek</text>
  <text class="t-mono t-sm" x="188" y="172" text-anchor="middle">country = GB AND created_at &gt; Jan</text>

  <path class="ln green" d="M188 184 L188 204" marker-end="url(#arr-green)"/>
  <rect class="box green" x="40" y="206" width="296" height="56" rx="12"/>
  <text class="t-sm t-b" x="188" y="228" text-anchor="middle">Jump to the first GB leaf</text>
  <text class="t-xs" x="188" y="246" text-anchor="middle">then walk Jan &#8594; Mar &#8594; Jun</text>

  <text class="t-sm" x="188" y="286" text-anchor="middle"><tspan class="t-green t-b">&#10003;</tspan> leftmost prefix is an equality</text>
  <text class="t-xs" x="188" y="308" text-anchor="middle">range on the second column is then cheap</text>

  <!-- Skip -->
  <rect class="box panel" x="388" y="124" width="368" height="208" rx="16"/>
  <text class="t-label" x="572" y="150" text-anchor="middle">No seek</text>
  <text class="t-mono t-sm" x="572" y="172" text-anchor="middle">created_at &gt; Jan</text>

  <path class="ln orange" d="M572 184 L572 204" marker-end="url(#arr-orange)"/>
  <rect class="box orange" x="424" y="206" width="296" height="56" rx="12"/>
  <text class="t-sm t-b" x="572" y="228" text-anchor="middle">Dates are not consecutive</text>
  <text class="t-xs" x="572" y="246" text-anchor="middle">FR Jan &#183; GB Jan &#183; US Feb &#8230;</text>

  <text class="t-sm" x="572" y="286" text-anchor="middle"><tspan class="t-orange t-b">!</tspan> skipped the leading column</text>
  <text class="t-xs" x="572" y="308" text-anchor="middle">planner scans the index, or ignores it</text>
</svg>
