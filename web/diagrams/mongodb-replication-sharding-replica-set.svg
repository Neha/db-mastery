<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280">
  <rect class="box gray" x="20" y="100" width="120" height="64" rx="12"/>
  <text class="t-b" x="80" y="128" text-anchor="middle">App</text>
