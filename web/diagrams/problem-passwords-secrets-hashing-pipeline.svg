<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <text class="t-label" x="380" y="22" text-anchor="middle">Password hashing</text>

  <rect class="box gray" x="16" y="40" width="158" height="88" rx="12"/>
  <text class="t-b" x="95" y="72" text-anchor="middle">Password</text>
  <text class="t-xs" x="95" y="92" text-anchor="middle">low entropy</text>
  <text class="t-xs" x="95" y="108" text-anchor="middle">never store this</text>

  <path class="ln blue" d="M174 84 L196 84" marker-end="url(#arr-blue)"/>

  <rect class="box" x="198" y="40" width="158" height="88" rx="12"/>
  <text class="t-b" x="277" y="68" text-anchor="middle">Salt + pepper</text>
  <text class="t-xs" x="277" y="88" text-anchor="middle">salt: unique, in DB</text>
  <text class="t-xs" x="277" y="106" text-anchor="middle">pepper: secret, KMS</text>

  <path class="ln blue" d="M356 84 L378 84" marker-end="url(#arr-blue)"/>

  <rect class="box blue" x="380" y="40" width="158" height="88" rx="12"/>
  <text class="t-b" x="459" y="68" text-anchor="middle">Argon2id</text>
  <text class="t-xs" x="459" y="88" text-anchor="middle">or bcrypt</text>
  <text class="t-xs" x="459" y="106" text-anchor="middle">work factor ~200 ms</text>

  <path class="ln green" d="M538 84 L560 84" marker-end="url(#arr-green)"/>

  <rect class="box green" x="562" y="40" width="182" height="88" rx="12"/>
  <text class="t-b" x="653" y="68" text-anchor="middle">Store the hash</text>
  <text class="t-mono" x="653" y="90" text-anchor="middle">$argon2id$...</text>
  <text class="t-xs" x="653" y="108" text-anchor="middle">timing-safe compare</text>

  <rect class="box panel" x="16" y="152" width="352" height="152" rx="16"/>
  <text class="t-label t-red" x="192" y="176" text-anchor="middle">Fast hash alone</text>
  <text class="t-b" x="192" y="206" text-anchor="middle">MD5 &#183; SHA-1 &#183; SHA-256</text>
  <text class="t-sm" x="192" y="230" text-anchor="middle">billions of guesses / sec</text>
  <text class="t-sm" x="192" y="250" text-anchor="middle">rainbow tables if unsalted</text>
  <text class="t-sm t-red t-b" x="192" y="278" text-anchor="middle">broken for passwords</text>

  <rect class="box panel" x="392" y="152" width="352" height="152" rx="16"/>
  <text class="t-label t-green" x="568" y="176" text-anchor="middle">Password KDF</text>
  <text class="t-b" x="568" y="206" text-anchor="middle">Argon2id &#183; bcrypt</text>
  <text class="t-sm" x="568" y="230" text-anchor="middle">a few guesses per second</text>
  <text class="t-sm" x="568" y="250" text-anchor="middle">unique salt, optional pepper</text>
  <text class="t-sm t-green t-b" x="568" y="278" text-anchor="middle">designed to be slow</text>
</svg>
