<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <text class="t-label" x="380" y="26" text-anchor="middle">Primary-key insert locality</text>

  <rect class="box panel" x="16" y="44" width="236" height="236" rx="16"/>
  <text class="t-b" x="134" y="76" text-anchor="middle">BIGSERIAL</text>
  <text class="t-xs" x="134" y="96" text-anchor="middle">1, 2, 3, 4&#8230;</text>
  <rect class="box green" x="44" y="116" width="180" height="36" rx="10"/>
  <text class="t-sm" x="134" y="138" text-anchor="middle">rightmost leaf</text>
  <path class="ln green" d="M134 152 L134 172" marker-end="url(#arr-green)"/>
  <rect class="box green" x="44" y="174" width="180" height="36" rx="10"/>
  <text class="t-sm" x="134" y="196" text-anchor="middle">append, sequential I/O</text>
  <text class="t-xs" x="134" y="236" text-anchor="middle">fast inserts; the hot</text>
  <text class="t-xs" x="134" y="252" text-anchor="middle">leaf can contend</text>

  <rect class="box panel" x="262" y="44" width="236" height="236" rx="16"/>
  <text class="t-b" x="380" y="76" text-anchor="middle">UUIDv4</text>
  <text class="t-xs" x="380" y="96" text-anchor="middle">random 128-bit</text>
  <rect class="box red" x="290" y="116" width="180" height="36" rx="10"/>
  <text class="t-sm" x="380" y="138" text-anchor="middle">random leaf</text>
  <path class="ln red" d="M380 152 L380 172" marker-end="url(#arr-red)"/>
  <rect class="box red" x="290" y="174" width="180" height="36" rx="10"/>
  <text class="t-sm" x="380" y="196" text-anchor="middle">page splits, cache miss</text>
  <text class="t-xs" x="380" y="236" text-anchor="middle">no hotspot; the B-tree</text>
  <text class="t-xs" x="380" y="252" text-anchor="middle">and WAL scatter</text>

  <rect class="box panel" x="508" y="44" width="236" height="236" rx="16"/>
  <text class="t-b" x="626" y="76" text-anchor="middle">UUIDv7 / snowflake</text>
  <text class="t-xs" x="626" y="96" text-anchor="middle">time-ordered</text>
  <rect class="box blue" x="536" y="116" width="180" height="36" rx="10"/>
  <text class="t-sm" x="626" y="138" text-anchor="middle">near-rightmost leaf</text>
  <path class="ln blue" d="M626 152 L626 172" marker-end="url(#arr-blue)"/>
  <rect class="box blue" x="536" y="174" width="180" height="36" rx="10"/>
  <text class="t-sm" x="626" y="196" text-anchor="middle">mostly sequential</text>
  <text class="t-xs" x="626" y="236" text-anchor="middle">ObjectId is time-prefixed</text>
  <text class="t-xs" x="626" y="252" text-anchor="middle">too; 12 bytes, not 16</text>
</svg>
