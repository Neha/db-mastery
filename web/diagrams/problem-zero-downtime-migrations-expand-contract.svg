<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <!-- ===== Step cards ===== -->
  <!-- 1 -->
  <rect class="box" x="14" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-blue" cx="70" cy="44" r="12"/>
  <text class="t-on t-b" x="70" y="49" text-anchor="middle">1</text>
  <text class="t-b" x="70" y="80" text-anchor="middle">Add column</text>
  <rect class="box" x="24" y="94" width="92" height="26" rx="13"/>
  <text class="t-mono" x="70" y="111" text-anchor="middle">name</text>
  <rect class="box ghost" x="24" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono t-muted" x="70" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="70" y="176" text-anchor="middle">writes: old</text>
  <text class="t-sm" x="70" y="194" text-anchor="middle">reads: old</text>
  <text class="t-xs" x="70" y="216" text-anchor="middle">DDL, nullable</text>

  <!-- 2 -->
  <rect class="box" x="138" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-blue" cx="194" cy="44" r="12"/>
  <text class="t-on t-b" x="194" y="49" text-anchor="middle">2</text>
  <text class="t-b" x="194" y="80" text-anchor="middle">Dual write</text>
  <rect class="box" x="148" y="94" width="92" height="26" rx="13"/>
  <text class="t-mono" x="194" y="111" text-anchor="middle">name</text>
  <rect class="box ghost" x="148" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono" x="194" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="194" y="176" text-anchor="middle">writes: <tspan class="t-b">both</tspan></text>
  <text class="t-sm" x="194" y="194" text-anchor="middle">reads: old</text>
  <text class="t-xs" x="194" y="216" text-anchor="middle">app deploy</text>

  <!-- 3 -->
  <rect class="box" x="262" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-purple" cx="318" cy="44" r="12"/>
  <text class="t-on t-b" x="318" y="49" text-anchor="middle">3</text>
  <text class="t-b" x="318" y="80" text-anchor="middle">Backfill</text>
  <rect class="box" x="272" y="94" width="92" height="26" rx="13"/>
  <text class="t-mono" x="318" y="111" text-anchor="middle">name</text>
  <rect class="box purple" x="272" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono" x="318" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="318" y="176" text-anchor="middle">writes: both</text>
  <text class="t-sm" x="318" y="194" text-anchor="middle">reads: old</text>
  <text class="t-xs" x="318" y="216" text-anchor="middle">batched job</text>

  <!-- 4 -->
  <rect class="box" x="386" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-purple" cx="442" cy="44" r="12"/>
  <text class="t-on t-b" x="442" y="49" text-anchor="middle">4</text>
  <text class="t-b" x="442" y="80" text-anchor="middle">Read new</text>
  <rect class="box" x="396" y="94" width="92" height="26" rx="13"/>
  <text class="t-mono" x="442" y="111" text-anchor="middle">name</text>
  <rect class="box purple" x="396" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono" x="442" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="442" y="176" text-anchor="middle">writes: both</text>
  <text class="t-sm" x="442" y="194" text-anchor="middle">reads: <tspan class="t-b">new</tspan></text>
  <text class="t-xs" x="442" y="216" text-anchor="middle">feature flag</text>

  <!-- 5 -->
  <rect class="box" x="510" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-green" cx="566" cy="44" r="12"/>
  <text class="t-on t-b" x="566" y="49" text-anchor="middle">5</text>
  <text class="t-b" x="566" y="80" text-anchor="middle">Write new</text>
  <rect class="box ghost" x="520" y="94" width="92" height="26" rx="13"/>
  <text class="t-mono t-muted" x="566" y="111" text-anchor="middle">name</text>
  <rect class="box green" x="520" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono" x="566" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="566" y="176" text-anchor="middle">writes: <tspan class="t-b">new</tspan></text>
  <text class="t-sm" x="566" y="194" text-anchor="middle">reads: new</text>
  <text class="t-xs" x="566" y="216" text-anchor="middle">app deploy</text>

  <!-- 6 -->
  <rect class="box" x="634" y="20" width="112" height="206" rx="12"/>
  <circle class="fill-green" cx="690" cy="44" r="12"/>
  <text class="t-on t-b" x="690" y="49" text-anchor="middle">6</text>
  <text class="t-b" x="690" y="80" text-anchor="middle">Drop old</text>
  <path class="ln faint" d="M654 107 L726 107"/>
  <text class="t-mono t-muted" x="690" y="111" text-anchor="middle">name</text>
  <rect class="box green" x="644" y="126" width="92" height="26" rx="13"/>
  <text class="t-mono" x="690" y="143" text-anchor="middle">full_name</text>
  <text class="t-sm" x="690" y="176" text-anchor="middle">writes: new</text>
  <text class="t-sm" x="690" y="194" text-anchor="middle">reads: new</text>
  <text class="t-xs" x="690" y="216" text-anchor="middle">DDL, after soak</text>

  <!-- ===== Phase brackets ===== -->
  <path class="ln blue thick" d="M18 246 L246 246"/>
  <text class="t-label t-blue" x="132" y="268" text-anchor="middle">Expand</text>
  <text class="t-xs" x="132" y="283" text-anchor="middle">additive, old code still works</text>

  <path class="ln purple thick" d="M266 246 L494 246"/>
  <text class="t-label t-purple" x="380" y="268" text-anchor="middle">Migrate</text>
  <text class="t-xs" x="380" y="283" text-anchor="middle">copy data, flip reads</text>

  <path class="ln green thick" d="M514 246 L742 246"/>
  <text class="t-label t-green" x="628" y="268" text-anchor="middle">Contract</text>
  <text class="t-xs" x="628" y="283" text-anchor="middle">remove the old shape</text>

  <text class="t-sm" x="380" y="316" text-anchor="middle">Every step is its own deploy and can be rolled back until step 6.</text>
</svg>
