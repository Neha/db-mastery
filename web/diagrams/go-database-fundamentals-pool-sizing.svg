  <!-- ========== goroutines ========== -->
  <rect class="box panel" x="16" y="16" width="190" height="236" rx="16"/>
  <text class="t-label" x="111" y="42" text-anchor="middle">Goroutines</text>
  <g class="fill-gray">
    <circle cx="51" cy="74" r="7"/><circle cx="81" cy="74" r="7"/><circle cx="111" cy="74" r="7"/><circle cx="141" cy="74" r="7"/><circle cx="171" cy="74" r="7"/>
    <circle cx="51" cy="104" r="7"/><circle cx="81" cy="104" r="7"/><circle cx="111" cy="104" r="7"/><circle cx="141" cy="104" r="7"/><circle cx="171" cy="104" r="7"/>
    <circle cx="51" cy="134" r="7"/><circle cx="81" cy="134" r="7"/><circle cx="111" cy="134" r="7"/><circle cx="141" cy="134" r="7"/><circle cx="171" cy="134" r="7"/>
    <circle cx="51" cy="164" r="7"/><circle cx="81" cy="164" r="7"/><circle cx="111" cy="164" r="7"/><circle cx="141" cy="164" r="7"/><circle cx="171" cy="164" r="7"/>
    <circle cx="51" cy="194" r="7"/><circle cx="81" cy="194" r="7"/><circle cx="111" cy="194" r="7"/><circle cx="141" cy="194" r="7"/><circle cx="171" cy="194" r="7"/>
  </g>
  <text class="t-xs" x="111" y="232" text-anchor="middle">thousands are cheap</text>

  <path class="ln" d="M208 134 L236 134" marker-end="url(#arr)"/>

  <!-- ========== pool ========== -->
  <rect class="box panel" x="240" y="16" width="250" height="236" rx="16"/>
  <text class="t-label" x="365" y="42" text-anchor="middle">Pool &#183; MaxConns 10</text>

  <text class="t-xs" x="290" y="64" text-anchor="middle">waiting</text>
  <rect class="box orange" x="260" y="74" width="60" height="22" rx="11"/>
  <rect class="box orange" x="260" y="104" width="60" height="22" rx="11"/>
  <rect class="box orange" x="260" y="134" width="60" height="22" rx="11"/>
  <rect class="box orange" x="260" y="164" width="60" height="22" rx="11"/>
  <text class="t-xs t-orange" x="290" y="210" text-anchor="middle">Acquire()</text>
  <text class="t-xs t-orange" x="290" y="224" text-anchor="middle">blocks</text>

  <text class="t-xs" x="410" y="64" text-anchor="middle">connections</text>
  <rect class="box blue" x="344" y="74" width="60" height="24" rx="8"/>
  <rect class="box blue" x="416" y="74" width="60" height="24" rx="8"/>
  <rect class="box blue" x="344" y="106" width="60" height="24" rx="8"/>
  <rect class="box blue" x="416" y="106" width="60" height="24" rx="8"/>
  <rect class="box blue" x="344" y="138" width="60" height="24" rx="8"/>
  <rect class="box blue" x="416" y="138" width="60" height="24" rx="8"/>
  <rect class="box blue" x="344" y="170" width="60" height="24" rx="8"/>
  <rect class="box blue" x="416" y="170" width="60" height="24" rx="8"/>
  <rect class="box" x="344" y="202" width="60" height="24" rx="8"/>
  <rect class="box" x="416" y="202" width="60" height="24" rx="8"/>
  <text class="t-xs" x="374" y="218" text-anchor="middle">idle</text>
  <text class="t-xs" x="446" y="218" text-anchor="middle">idle</text>

  <path class="ln blue" d="M492 134 L520 134" marker-end="url(#arr-blue)"/>

  <!-- ========== Postgres ========== -->
  <rect class="box panel" x="524" y="16" width="220" height="236" rx="16"/>
  <text class="t-label" x="634" y="42" text-anchor="middle">Postgres &#183; 4 vCPU</text>
  <rect class="box teal" x="560" y="70" width="64" height="44" rx="10"/>
  <text class="t-xs" x="592" y="96" text-anchor="middle">core</text>
  <rect class="box teal" x="644" y="70" width="64" height="44" rx="10"/>
  <text class="t-xs" x="676" y="96" text-anchor="middle">core</text>
  <rect class="box teal" x="560" y="130" width="64" height="44" rx="10"/>
  <text class="t-xs" x="592" y="156" text-anchor="middle">core</text>
  <rect class="box teal" x="644" y="130" width="64" height="44" rx="10"/>
  <text class="t-xs" x="676" y="156" text-anchor="middle">core</text>
  <text class="t-xs" x="634" y="206" text-anchor="middle">one backend process</text>
  <text class="t-xs" x="634" y="220" text-anchor="middle">per connection</text>

  <!-- ========== Little's law ========== -->
  <rect class="box panel" x="16" y="270" width="728" height="66" rx="16"/>
  <text class="t-xl" x="44" y="310">L = &#955; &#215; W</text>
  <text class="t-sm" x="190" y="298"><tspan class="t-b">2,000 queries/s &#215; 5 ms</tspan> per query = <tspan class="t-b t-blue">10 connections busy</tspan> on average</text>
  <text class="t-sm" x="190" y="318">Size for peak plus headroom, then cap the total across every pod and replica.</text>
</svg>
