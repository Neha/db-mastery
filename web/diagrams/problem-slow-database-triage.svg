<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500">
  <!-- symptom -->
  <rect class="box gray" x="290" y="12" width="180" height="32" rx="16"/>
  <text class="t-b" x="380" y="33" text-anchor="middle">&#8220;The DB is slow&#8221;</text>
  <path class="ln" d="M380 44 L380 66" marker-end="url(#arr)"/>

  <!-- is it the db -->
  <rect class="box blue" x="250" y="68" width="260" height="50" rx="12"/>
  <text class="t-b" x="380" y="89" text-anchor="middle">Is it the database at all?</text>
  <text class="t-xs" x="380" y="106" text-anchor="middle">DB time vs total request time</text>

  <path class="ln dash" d="M510 93 L554 93" marker-end="url(#arr)"/>
  <text class="t-xs" x="532" y="86" text-anchor="middle">no</text>
  <rect class="box ghost" x="556" y="72" width="184" height="42" rx="12"/>
  <text class="t-sm" x="648" y="90" text-anchor="middle">app, network, pool,</text>
  <text class="t-sm" x="648" y="105" text-anchor="middle">GC, DNS, downstream API</text>

  <path class="ln blue" d="M380 118 L380 144" marker-end="url(#arr-blue)"/>
  <text class="t-xs" x="390" y="135">yes</text>

  <!-- one query or everything -->
  <rect class="box blue" x="250" y="146" width="260" height="42" rx="12"/>
  <text class="t-b" x="380" y="172" text-anchor="middle">One query, or everything?</text>

  <path class="ln blue" d="M300 188 C 300 220, 135 214, 135 258" marker-end="url(#arr-blue)"/>
  <text class="t-sm t-b" x="190" y="214" text-anchor="middle">one query</text>
  <path class="ln blue" d="M460 188 C 460 214, 510 212, 510 234" marker-end="url(#arr-blue)"/>
  <text class="t-sm t-b" x="540" y="214">everything</text>

  <!-- left column: one query -->
  <rect class="box" x="20" y="260" width="230" height="40" rx="11"/>
  <text class="t-mono" x="135" y="284" text-anchor="middle">EXPLAIN (ANALYZE, BUFFERS)</text>
  <path class="ln" d="M135 300 L135 314" marker-end="url(#arr)"/>
  <rect class="box" x="20" y="316" width="230" height="40" rx="11"/>
  <text class="t-sm" x="135" y="340" text-anchor="middle">estimated vs actual rows?</text>
  <path class="ln" d="M135 356 L135 370" marker-end="url(#arr)"/>
  <rect class="box" x="20" y="372" width="230" height="40" rx="11"/>
  <text class="t-sm" x="135" y="396" text-anchor="middle">plan changed? stats? parameters?</text>
  <path class="ln green" d="M135 412 L135 450" marker-end="url(#arr-green)"/>

  <!-- right panel: everything -->
  <rect class="box panel" x="270" y="236" width="480" height="204" rx="16"/>
  <text class="t-label" x="510" y="256" text-anchor="middle">What is saturated? (USE method)</text>

  <rect class="box orange" x="286" y="268" width="214" height="76" rx="12"/>
  <text class="t-b" x="300" y="290">CPU pegged</text>
  <text class="t-sm" x="300" y="310">top queries by total time</text>
  <text class="t-sm" x="300" y="327">seq scans, bad plans, N+1</text>

  <rect class="box orange" x="520" y="268" width="214" height="76" rx="12"/>
  <text class="t-b" x="534" y="290">I/O bound</text>
  <text class="t-sm" x="534" y="310">hit ratio, IOPS, burst credits</text>
  <text class="t-sm" x="534" y="327">working set &gt; RAM, bloat</text>

  <rect class="box orange" x="286" y="352" width="214" height="76" rx="12"/>
  <text class="t-b" x="300" y="374">Lock waits</text>
  <text class="t-sm" x="300" y="394">wait_event_type = Lock</text>
  <text class="t-sm" x="300" y="411">idle in transaction, DDL</text>

  <rect class="box orange" x="520" y="352" width="214" height="76" rx="12"/>
  <text class="t-b" x="534" y="374">Connections</text>
  <text class="t-sm" x="534" y="394">count by state vs max</text>
  <text class="t-sm" x="534" y="411">storm, no pooler, leaks</text>

  <path class="ln green" d="M510 440 L510 450" marker-end="url(#arr-green)"/>

  <!-- outcomes -->
  <rect class="box green" x="20" y="452" width="230" height="34" rx="17"/>
  <text class="t-sm t-b" x="135" y="473" text-anchor="middle">index &#183; ANALYZE &#183; rewrite</text>
  <rect class="box green" x="330" y="452" width="360" height="34" rx="17"/>
  <text class="t-sm t-b" x="510" y="473" text-anchor="middle">fix the top consumer, then re-measure</text>
</svg>
