  <rect class="box" x="448" y="96" width="52" height="36" rx="10"/>
  <text x="474" y="119" text-anchor="middle">D1</text>

  <rect class="box teal" x="316" y="144" width="100" height="36" rx="10"/>
  <text class="t-mono" x="366" y="167" text-anchor="middle">graph</text>
  <path class="ln" d="M418 162 L444 162" marker-end="url(#arr)"/>
  <rect class="box" x="448" y="144" width="52" height="36" rx="10"/>
