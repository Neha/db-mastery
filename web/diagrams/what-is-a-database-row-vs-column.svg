  <text class="t-mono" x="543" y="205" text-anchor="middle">eve</text>
  <text class="t-mono" x="605" y="77" text-anchor="middle">03-01</text>
  <text class="t-mono" x="605" y="109" text-anchor="middle">03-01</text>
